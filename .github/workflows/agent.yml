name: weekly-topics-agent

on:
  schedule:
    - cron: '0 1 * * 1' # 每周一 01:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r agent/requirements.txt

      - name: Run agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SITE_FEED: ${{ vars.SITE_FEED }}
          SITE_BRIEF: ${{ vars.SITE_BRIEF }}
        run: python agent/topics.py

      - name: Commit
        run: |
          git config user.name "topics-agent"
          git config user.email "actions@users.noreply.github.com"
          git add weekly/
          git commit -m "agent: topics $(date -u +%F)" || echo "no changes"
          git push
